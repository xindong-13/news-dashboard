# 每天兩刊：抓新聞 → AI 整理 → commit data/ → 部署網站。
# 任何一步失敗，Actions 會亮紅燈（GitHub 會寄信通知 repo 擁有者）。
name: 出刊
run-name: 出刊（${{ inputs.target || (github.event_name == 'schedule' && 'GitHub 排程備援') || '手動' }}）

on:
  # 準時出刊靠外部觸發：Cloudflare Worker（worker/trigger.mjs）在台北 11:50、20:50 呼叫
  # workflow_dispatch，並用 target 指定哪一刊。
  # GitHub 的排程實測會晚 6～10 小時，只當備援：跑起來時「現在該出、但還沒出」的那一刊才出（--due），
  # 已經出過或不在該刊的時段內就直接結束，不會重抓、覆蓋，也不會出成別的日期。
  schedule:
    - cron: "50 3 * * *"   # 台北 11:50
    - cron: "20 4 * * *"   # 台北 12:20
    - cron: "20 5 * * *"   # 台北 13:20
    - cron: "50 12 * * *"  # 台北 20:50
    - cron: "20 13 * * *"  # 台北 21:20
    - cron: "20 14 * * *"  # 台北 22:20
  workflow_dispatch:
    inputs:
      edition:
        description: 刊別（auto＝依現在時間判斷）
        type: choice
        options: [auto, noon, night]
        default: auto
      no_llm:
        description: 不呼叫 AI（測試用，輸出降級版）
        type: boolean
        default: false
      target:
        description: 給自動觸發用，手動執行請留空（填了就不會覆蓋已出的刊）
        type: string
        default: ""

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # 要抓分支最新版，不能用預設的 github.sha：同一刊被觸發兩次時，後一次會排隊，
      # github.sha 是排隊前的版本，看不到前一次剛 commit 的刊，會重出一次。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 安裝依賴
        run: uv sync --locked

      - name: 產生一刊
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
          EVENT: ${{ github.event_name }}
          EDITION: ${{ inputs.edition }}
          NO_LLM: ${{ inputs.no_llm }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            args=(--due)
          elif [ -n "$TARGET" ]; then
            args=(--target "$TARGET")
          else
            args=(--edition "${EDITION:-auto}")
          fi
          if [ "$NO_LLM" = "true" ]; then args+=(--no-llm); fi
          uv run python -m pipeline.main "${args[@]}"

      - name: commit 資料
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新資料"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "出刊：$(ls -t data/editions | head -1 | sed 's/\.json$//')"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: edition
    if: needs.edition.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.edition.outputs.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write

  # 網站部署完才推播（訊息裡的連結才點得開）。沒設定 LINE 的 Secrets 就自動略過。
  notify:
    needs: [edition, deploy]
    if: needs.edition.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.edition.outputs.sha }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 推播到 LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          PYTHONIOENCODING: utf-8
        run: uv run --locked python -m pipeline.notify
