# 新聞來源設定
#
# 欄位說明：
#   id          唯一代號（英數、底線）
#   name        顯示在網站上的來源名稱
#   url         RSS 網址或 API 網址
#   type        rss | api
#   parser      type=api 時必填：cnyes | twse_news | leaguepedia_news
#   category    taiwan | world | finance | esports
#   language    zh-TW | zh-CN | en | ko（zh-CN 會自動轉成繁體）
#   weight      0～3，可信度／重要度權重，預設 1
#   enabled     false 就不抓
#   選填：subcategory、game（lol/valorant/cs2）、league（lck/lpl/international/other）、
#         max_items（預設 40）、keywords、exclude_keywords、ignore_robots、note
#
# 新增來源後，跑 `uv run python scripts/check_sources.py --id 新的id` 確認抓得到。
# 實測結果與換掉的來源見 DECISIONS.md。

