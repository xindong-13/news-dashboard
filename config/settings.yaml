# 全域設定。時間一律以台北時間理解。

timezone: Asia/Taipei

http:
  # M6 建立 GitHub repo 後，把網址換成實際的 repo，讓對方知道是誰在抓
  user_agent: "news-dashboard/0.1 (personal news digest; +https://github.com/)"
  timeout_seconds: 20
  per_domain_delay_seconds: 1.0
  domain_delays:
    lol.fandom.com: 2.0
    news.google.com: 1.5
  respect_robots_txt: true

edition:
  noon_cutoff: "16:30"       # 早於這個時間執行算午報，否則算晚報
  default_lookback_hours: 12 # 找不到上一刊時往回抓幾小時
  max_window_hours: 24       # 漏刊時，時間範圍最長幾小時

processing:
  max_items_per_edition: 200       # 送進 LLM 的最多事件數，超過的先用規則篩掉
  title_similarity_threshold: 85   # 標題相似度（0～100）≥ 此值視為同一事件（英文）
  title_similarity_threshold_cjk: 60  # 中日韓文標題的門檻（各家改寫幅度大，實測同一事件多在 60～80）
  ai_title_similarity_threshold: 65   # AI 翻譯後的繁中標題再合併一次（實測同一事件 71、不同事件 57）
  summarize_top_n: 80              # 只替前 N 則寫摘要
  summarize_min_importance: 2      # 重要度低於此值不寫摘要
  headlines_min: 5
  headlines_max: 8
  headlines_max_per_category: 2    # 每個分類最多幾則，避免轉會期電競新聞佔滿今日重點

esports:
  league_priority: [lck, lpl, international, other]
  offseason:                 # 休賽季：轉會、陣容異動的重要度 +1
    - start: "11-01"
      end: "01-31"
  offseason_boost_tags: [transfer, roster]

llm:
  # 依序嘗試；遇到 429 或錯誤時退避重試一次，再換下一個。沒設定 API key 的會自動跳過。
  # 模型名稱 2026-11-16 實測（見 DECISIONS.md）。免費額度與模型變動很快，壞了先改這裡。
  # 同一家可以列兩次（不同模型），例如 Gemini 的備用模型。
  providers:
    - name: gemini
      model: gemini-3.5-flash-lite   # 免費；實測 1～2 秒、台灣用語正確。3.8-flash 實測逾時
      api_key_env: GEMINI_API_KEY
      min_interval_seconds: 5        # 免費版每分鐘次數有限
      options: { thinking_level: minimal }
    - name: groq
      model: openai/gpt-oss-120b     # 免費版每分鐘 8000 tokens、每天 1000 次
      api_key_env: GROQ_API_KEY
      min_interval_seconds: 3
      max_batch_items: 8             # 「輸入＋輸出上限」要小於每分鐘 8000 tokens，否則 413
      max_output_tokens: 3000
      options: { reasoning_effort: low }
    - name: anthropic
      model: claude-haiku-5-5        # 付費，有 ANTHROPIC_API_KEY 才會用
      api_key_env: ANTHROPIC_API_KEY
      options: { effort: low }
  classify_batch_size: 25            # 一次送幾則去分類＋翻標題
  summarize_batch_size: 12           # 一次送幾則去寫摘要
  request_timeout_seconds: 90
  retry_backoff_seconds: 20
  max_retry_wait_seconds: 65         # 429 時最多等多久再重試

markets:
  # 行情卡。主要來源：鉅亨網報價 API；fred 是備援（每日資料，會晚幾天）。
  # 代號格式「市場:代號:類型」，可到 invest.cnyes.com 找，例如個股 TWS:2454:STOCK、美股 USS:NVDA:STOCK。
  # Yahoo Finance（yfinance）的 robots.txt 全站禁止，不使用，見 DECISIONS.md。
  items:
    - { id: taiex, name: 台股加權指數, cnyes: "TWS:TSE01:INDEX" }
    - { id: "2330", name: 台積電, cnyes: "TWS:2330:STOCK", currency: TWD }
    - { id: dji, name: 道瓊工業指數, cnyes: "GI:DJI:INDEX", fred: DJIA }
    - { id: spx, name: S&P 500, cnyes: "GI:INX:INDEX", fred: SP500 }
    - { id: nasdaq, name: 那斯達克, cnyes: "GI:IXIC:INDEX", fred: NASDAQCOM }
    - { id: sox, name: 費城半導體, cnyes: "GI:SOX:INDEX" }
    - { id: usdtwd, name: 美元兌台幣, cnyes: "FX:USDTWD:FOREX", decimals: 3 }
    - { id: us10y, name: 美國10年期公債殖利率, cnyes: "GF:US10YY:FUTURES", fred: DGS10, decimals: 3, unit: "%" }
    - { id: gold, name: 黃金（現貨）, cnyes: "GI:XAUUSDOZ:INDEX", currency: USD }
    - { id: wti, name: 原油（WTI）, fred: DCOILWTICO, currency: USD }  # 鉅亨網查不到原油代號
    - { id: btc, name: 比特幣, cnyes: "CC:BTC:FOREX", decimals: 0, currency: USD }
