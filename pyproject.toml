[project]
name = "news-dashboard"
version = "0.1.0"
description = "個人每日新聞儀表板：台灣 × 國際 × 財經 × 電競"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "numpy>=2.5.4",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.14.6",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # 行長交給 ruff format；中文註解與網址不強制換行

[tool.pytest.ini_options]
testpaths = ["tests"]
